<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatXFEL Poster Preview</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f1b2d;
      --muted: #61556b;
      --accent: #7a1f77;
      --line: #e8deea;
      --bg: #fbf8fc;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(12px);
    }
    .bar {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 650;
      white-space: nowrap;
    }
    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 18px auto 26px;
      border: 1px solid var(--line);
      background: white;
      min-height: calc(100vh - 130px);
    }
    object {
      display: block;
      width: 100%;
      height: calc(100vh - 148px);
      min-height: 720px;
      border: 0;
    }
    .fallback {
      padding: 28px;
      font-size: 17px;
    }
    @media (max-width: 720px) {
      header {
        position: static;
      }
      main {
        width: 100%;
        margin: 0;
        border-left: 0;
        border-right: 0;
      }
      object {
        height: 78vh;
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1>ChatXFEL Poster Preview</h1>
        <p>Multimodal scientific RAG for XFEL literature evidence.</p>
        <p>Public copy anonymized for privacy: author and contact details removed.</p>
      </div>
      <a class="button" href="poster.pdf">Download PDF</a>
    </div>
  </header>
  <main>
    <object data="poster.pdf" type="application/pdf">
      <div class="fallback">
        Your browser cannot preview this PDF directly.
        <a href="poster.pdf">Open or download the poster PDF.</a>
      </div>
    </object>
  </main>
</body>
</html>
